name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务,不取消正在进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # 使用 npm install + --legacy-peer-deps,绕开 npm 10.x 在某些依赖图上的
        # "Cannot read properties of null (reading 'edgesOut')" 错误
        # (原 2026-09 之前可正常 npm ci,但 2026-10 之后偶发该错误,导致 GitHub Pages 一直停留在 9-7 的旧构建)
        run: npm install --no-audit --legacy-peer-deps

      - name: Build
        run: npm run build

      # vue-router 使用 history 模式,GitHub Pages 对未知路径返回 404。
      # 复制一份 index.html 为 404.html,让深层链接和刷新都能回到 SPA。
      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
